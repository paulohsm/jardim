; PlatformIO project for the ESP-01S gate-trigger firmware.
; Board: "Generic ESP8266 Module", 512KB flash, DOUT flash mode — matches
; the module already soldered into the gate control board (confirmed from
; the working Arduino / Arduino Cloud sketches: FlashMode=dout, eesz=512K).
;
; IMPORTANT — verify before the first build: run `pio boards esp01` and
; confirm it reports 512KB flash. I could not compile this myself in this
; session (no working shell on your machine / no network to fetch
; PlatformIO in the cloud sandbox), so this hasn't been build-tested yet.
; If `esp01` doesn't exist or doesn't match in your installed platform
; version, run `pio boards | grep -i esp01` and tell me what it shows —
; we'll adjust the board id together.

[env:esp01_gate]
platform = espressif8266
board = esp01
framework = arduino
monitor_speed = 115200

; Flash layout: DOUT mode (matches the module). The "esp01" board's own
; default ldscript (eagle.flash.512k0.ld) doesn't exist in the installed
; core (confirmed via `ls .../tools/sdk/ld/` — that naming was dropped;
; the current zero-SPIFFS 512k variant is just eagle.flash.512k.ld, with
; eagle.flash.512k32/64/128.ld being the versions that reserve a small
; SPIFFS partition). We don't need a filesystem, so pin the base one to
; maximize app space.
board_build.flash_mode = dout
board_build.flash_freq = 40m
board_build.ldscript = eagle.flash.512k.ld

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D MQTT_MAX_PACKET_SIZE=256
    ; Trims BearSSL to a smaller set of cipher suites (still includes the
    ; common ECDHE-RSA-AES128-GCM-SHA256 family most cloud brokers use) —
    ; first lever for the ~31KB flash overflow the first real build showed.
    ; Certificate validation itself is unaffected; only which ciphers are
    ; compiled in.
    -D BEARSSL_SSL_BASIC
